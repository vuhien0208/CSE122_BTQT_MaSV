<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bài 11 - thư viện ảnh Việt Nam</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="gallery">
            <header class="gallery-header">
                <h1>Thư viện ảnh Việt Nam</h1>
                <p>Bộ sưu tập 6 danh lam thắng tiêu biểu - minh họa thẻ figure</p>
            </header>
            <section class="gallery-gird">
                <figure class="gallery-item">
                    <img src="1-vinh-ha-long.jpg" alt="Bãi biển Vịnh Hạ Long">
                    <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
                </figure>
                <figure>
                    <figure class="gallery-item">
                        <img src="2-son-doong.jpg" alt="Khám phá hang Sơn Đoòng">
                        <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
                    </figure>
                </figure>
                <figure>
                    <figure class="gallery-item">
                        <img src="3-thac-ban-gioc.jpg" alt="Thác Bản Giốc giữa núi rừng">
                        <figcaption>Hình 3. Thác Bản Giốc</figcaption>
                    </figure>
                </figure>
                <figure>
                    <figure class="gallery-item">
                        <img src="4-fansipan.jpg" alt="Núi Fansipan trên biển mây">
                        <figcaption>Hình 4. Fansipan</figcaption>
                    </figure>
                </figure>
                <figure>
                    <figure class="gallery-item">
                        <img src="5-mekong.jpg" alt="Hoạt động trên sông Cửu Long">
                        <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
                    </figure>
                </figure>
                <figure>
                    <figure class="gallery-item">
                        <img src="6-phong-nha.jpg" alt="Động nhũ trong động phong Nha">
                        <figcaption>Hình 6. Động Phong Nha</figcaption>
                    </figure>
                </figure>
            </section>
        </main>
    </body>
</html>
