<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Liên hệ với chúng tôi</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="contact-container">
            <div class="contact-header">
                <h2>Liên hệ với chúng tôi</h2>
                <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ</p>
            </div>
            <form action="#" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullname">Họ và tên</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên cảu bạn" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Nhập địa chỉ email" required>
                    </div>
                    <div class="form group">
                        <label for="phone">Số điện thoại</label>
                        <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại", required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Chủ đề</label>
                        <select id="subject" name="subject" reuired>
                            <option value="" disabled selected>Chọn chủ đề liên hệ</option>
                            <option calue="course">Hỏi về khóa học</option>
                             <option calue="support">Hỗ trợ kỹ thuật</option>
                              <option calue="other">Ý kiến khác</option>
                        </select>
                    </div>
                </div>
                <div class="form-group full-width">
                    <label for="message">Nội dung</label>
                    <textarea id="message" name="message" rows="5" placeholder="Nhập nội dung bạn muốn gửi..." required></textarea>
                </div>
                <div class="form-group-checkbox">
                    <iput type="checkbox" id="agree" name="agree" required></iput>
                    <label for="agree">Tôi đồng ý nhận email phản hồi.</label>               
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-submit">Gửi liên hệ</button>
                    <button type="reset" class="btn-reset">Nhập lại</button>
                </div>
            </form>
        </div>
    </body>
</html>
