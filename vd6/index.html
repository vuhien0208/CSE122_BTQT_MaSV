<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Các món ngon ở Hà Nội</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="main-title">Các món ngon Hà Nội</h1>
        <div class="content-wrapper">
            <div class="image-box">
                <img src="Bat.gif" alt="Ảnh minh họa món ăn">
            </div>
            <table class="food-table">
                <thead>
                    <tr>
                        <th class="col-stt">STT</th>
                        <th class="col-name">Tên món ăn</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="col-stt">1</td>
                        <td>Bánh cuốn Thanh Trì</td>
                    </tr>
                    <tr>
                        <td class="col-stt">2</td>
                        <td>Xôi Hà Nội</td>
                    </tr>
                    <tr>
                        <td class="col-stt">3</td>
                        <td>Chả cá Lã Vọng</td>
                    </tr>
                    <tr>
                        <td class="col-stt">4</td>
                        <td>Cháo cóc</td>
                    </tr>
                    <tr>
                        <td class="col-stt">5</td>
                        <td>Bánh gai ninh giang</td>
                    </tr>
                    <tr>
                        <td class="col-stt">6</td>
                        <td>Bún thang hà nội</td>
                    </tr>
                    <tr>
                        <td class="col-stt">7</td>
                        <td>Canh lằng</td>
                    </tr>
                    <tr>
                        <td class="col-stt">8</td>
                        <td>Vịt quay lạng sơn</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
