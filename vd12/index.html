<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>In Lịch Ngày Tháng Năm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-container">
    <!-- Khung hiển thị lịch -->
    <div class="calendar-card" id="ketQua" style="display: none;">
        <div id="lblNam" class="cal-year"></div>
        <div id="lblThang" class="cal-month"></div>
        <div id="lblSoNgay" class="cal-day-number"></div>
        <div id="lblThu" class="cal-day-name"></div>
    </div>

    <!-- Lời chào theo buổi -->
    <div id="lblChao" class="cal-greeting" style="display: none;"></div>

    <!-- Khung form nhập liệu -->
    <div class="input-card">
        <div class="input-group">
            <label>Ngày</label>
            <input type="text" id="txtNgay" value="24">
        </div>
        <div class="input-group">
            <label>Tháng</label>
            <input type="text" id="txtThang" value="12">
        </div>
        <div class="input-group">
            <label>Năm</label>
            <input type="text" id="txtNam" value="2026">
        </div>
        <div class="input-group">
            <button onclick="inLich()">In<br>lịch</button>
        </div>
    </div>
</div>

<script src="xuly.js"></script>
</body>
</html>
