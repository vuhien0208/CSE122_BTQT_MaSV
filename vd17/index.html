<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bài 17 - Form đăng ký</title>
        <link rel="stylesheet" href="style.css">
        <script src="main.js" defer></script>
    </head>
    <body>
        <div class="container">
            <h2>Đăng kí tài khoản</h2>
            <p class="description">
                Dữ liệu được kiếm tra bằng javaScript trước khi gửi.
            </p>
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="fullname">Họ và tên</label>
                    <input type="text" id="fullname" placeholer="Nhập họ và tên">
                    <small class="message" id="fullnameError"></small>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" id="email" placeholder="example@gmail.com">
                    <small class="message" id="emailError"></small>
                </div>
                <div class="form-group">
                    <label for="pasword">Mật khẩu</label>
                    <input type="pasword" id="password" placeholder="Nhập mật khẩu">
                    <small class="message" id="passwordError"></small>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">
                        Xác nhận mật khẩu
                    </label>
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">
                    <small class="message" id="confirmPasswordError"></small>
                </div>
                <button type="submit">Đăng ký</button>
                <p id="successMessage"></p>
            </form>
        </div>
    </body>
</html>
