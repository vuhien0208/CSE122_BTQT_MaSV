<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tham gia CLB Lập trình Web</title>
    <!-- Nhúng Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container" style="max-width: 800px;">
        <!-- CARD CHÍNH -->
        <div class="card shadow border-0">
            <!-- Card Header nền xanh (bg-success) -->
            <div class="card-header bg-success text-white text-center py-3">
                <h3 class="mb-0 fw-bold fs-4">Đăng ký tham gia CLB Lập trình Web</h3>
            </div>

            <!-- Card Body chứa Form -->
            <div class="card-body p-4 p-md-5">
                <form class="row g-3">
                    
                    <!-- Họ và tên -->
                    <div class="col-md-6">
                        <label for="fullName" class="form-label fw-semibold">Họ và tên</label>
                        <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
                    </div>

                    <!-- Mã sinh viên -->
                    <div class="col-md-6">
                        <label for="studentId" class="form-label fw-semibold">Mã sinh viên</label>
                        <input type="text" class="form-control" id="studentId" placeholder="22xxxxxx" required>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                    </div>

                    <!-- Số điện thoại -->
                    <div class="col-md-6">
                        <label for="phone" class="form-label fw-semibold">Số điện thoại</label>
                        <input type="tel" class="form-control" id="phone" placeholder="09xxxxxxxx" required>
                    </div>

                    <!-- Trình độ (Radio buttons) -->
                    <div class="col-12">
                        <label class="form-label fw-semibold d-block">Trình độ</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="levelRadio" id="levelBasic" value="Cơ bản" checked>
                            <label class="form-check-label" for="levelBasic">Cơ bản</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="levelRadio" id="levelIntermediate" value="Khá">
                            <label class="form-check-label" for="levelIntermediate">Khá</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="levelRadio" id="levelGood" value="Tốt">
                            <label class="form-check-label" for="levelGood">Tốt</label>
                        </div>
                    </div>

                    <!-- Chọn lớp (Select) -->
                    <div class="col-12">
                        <label for="classSelect" class="form-label fw-semibold">Chọn lớp</label>
                        <select class="form-select" id="classSelect" required>
                            <option value="" selected disabled>Chọn lớp của bạn</option>
                            <option value="67CNTT1">67CNTT1</option>
                            <option value="67CNTT2">67CNTT2</option>
                            <option value="67KTPM1">67KTPM1</option>
                            <option value="67KHMT1">67KHMT1</option>
                        </select>
                    </div>

                    <!-- Checkbox cam kết -->
                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="commitCheck" required>
                            <label class="form-check-label" for="commitCheck">
                                Tôi cam kết tự làm bài và quay video OBS
                            </label>
                        </div>
                    </div>

                    <!-- Nút bấm: Nhập lại & Đăng ký -->
                    <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                        <button type="reset" class="btn btn-outline-secondary px-4">Nhập lại</button>
                        <button type="submit" class="btn btn-success px-4">Đăng ký</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
