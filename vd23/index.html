<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh — Hiệu ứng Hover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Tiêu đề trang -->
        <header class="header">
            <h1>Thư viện ảnh — Hiệu ứng Hover</h1>
            <p>Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
        </header>

        <!-- Lưới 6 ảnh (CSS Grid) -->
        <div class="gallery-grid">
            
            <!-- Item 1 -->
            <div class="gallery-item">
                <img src="vinh-ha-long.jpg" alt="Vịnh Hạ Long">
                <div class="overlay">
                    <span class="location-name">Vịnh Hạ Long</span>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="gallery-item">
                <img src="hang-son-doong.jpg" alt="Hang Sơn Đoòng">
                <div class="overlay">
                    <span class="location-name">Hang Sơn Đoòng</span>
                </div>
            </div>

            <!-- Item 3 -->
            <div class="gallery-item">
                <img src="thac-ban-gioc.jpg" alt="Thác Bản Giốc">
                <div class="overlay">
                    <span class="location-name">Thác Bản Giốc</span>
                </div>
            </div>

            <!-- Item 4 -->
            <div class="gallery-item">
                <img src="fansipan.jpg" alt="Fansipan">
                <div class="overlay">
                    <span class="location-name">Fansipan</span>
                </div>
            </div>

            <!-- Item 5 -->
            <div class="gallery-item">
                <img src="dong-bang-song-cuu-long.jpg" alt="Đồng bằng sông Cửu Long">
                <div class="overlay">
                    <span class="location-name">Đồng bằng sông Cửu Long</span>
                </div>
            </div>

            <!-- Item 6 -->
            <div class="gallery-item">
                <img src="dong-phong-nha.jpg" alt="Động Phong Nha">
                <div class="overlay">
                    <span class="location-name">Động Phong Nha</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
